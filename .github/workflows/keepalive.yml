name: Supabase keep-alive

# Free Supabase projects are paused after about 7 days without activity.
# This reads one row from the database every 3 days to prevent it.
# It can also be started by hand from the Actions tab (and doing so re-enables a scheduled
# workflow that GitHub switched off after 60 days without commits).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/players?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat response.json; echo
          # 2xx and at least one row: the database answered. Anything else fails the job,
          # so GitHub emails you about it.
          case "$code" in 2*) ;; *) exit 1 ;; esac
          grep -q '"id"' response.json
